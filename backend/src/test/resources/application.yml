spring:
  application:
    name: admin-time2log-backend-test
  security:
    oauth2:
      resourceserver:
        jwt:
          # Dummy issuer-uri for property resolution (not actually used in tests)
          issuer-uri: http://localhost:54321/auth/v1
          # Use a static public key for tests instead of fetching from issuer
          public-key-location: classpath:test-public-key.pem
  mail:
    host: localhost
    port: 25

supabase:
  url: http://localhost:54321
  publishable-key: sb_publishable_test
  secret-key: sb_secret_test

cors:
  allowed-origins: http://localhost:3000

server:
  port: 0

app:
  url:
    user: http://localhost:4300
    admin: http://localhost:4200

logging:
  level:
    root: WARN
    ch.time2log: DEBUG
